name: 发布 Windows 安装包

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    name: 构建并发布 Windows 安装包
    runs-on: windows-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 配置 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.6.0 --activate

      - name: 安装前端依赖
        shell: pwsh
        run: pnpm --dir gui install --frozen-lockfile

      - name: 验证发布版本
        id: release_version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(?<version>(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*))$') {
            throw "发布标签必须是稳定版 SemVer（例如 v1.2.3）：$tag"
          }
          $version = $Matches.version
          $tauriVersion = (Get-Content -LiteralPath "gui/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          $packageVersion = (Get-Content -LiteralPath "gui/package.json" -Raw | ConvertFrom-Json).version
          $cargoMetadata = cargo metadata --locked --no-deps --format-version 1 --manifest-path "gui/src-tauri/Cargo.toml" | ConvertFrom-Json
          $cargoPackages = @($cargoMetadata.packages | Where-Object { $_.name -eq "ctfbox" })
          if ($cargoPackages.Count -ne 1) {
            throw "无法唯一确定 ctfbox Rust 包版本"
          }
          $cargoVersion = $cargoPackages[0].version
          if ($tauriVersion -ne $version -or $cargoVersion -ne $version -or $packageVersion -ne $version) {
            throw "版本不一致：tag=$version, tauri=$tauriVersion, cargo=$cargoVersion, package=$packageVersion"
          }
          "version=$version" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8

      - name: 前端质量检查
        shell: pwsh
        run: |
          pnpm --dir gui typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir gui test:unit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Rust 质量检查
        shell: pwsh
        run: |
          cargo fmt --manifest-path gui/src-tauri/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path gui/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Python 与汉化质量检查
        shell: pwsh
        run: |
          python -m unittest discover -s tools -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_localization.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 导入 Windows 代码签名证书
        id: signing_certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            throw "缺少 GitHub Secret：WINDOWS_CERTIFICATE_BASE64"
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "缺少 GitHub Secret：WINDOWS_CERTIFICATE_PASSWORD"
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "ctfbox-codesign.pfx"
          try {
            $pfxBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          } catch {
            throw "WINDOWS_CERTIFICATE_BASE64 不是有效的 Base64 编码 PFX"
          }
          [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $importedCertificates = @(Import-PfxCertificate `
            -FilePath $pfxPath `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -Password $password `
            -Exportable:$false)
          $codeSigningOid = "1.3.6.1.5.5.7.3.3"
          $signingCertificates = @($importedCertificates | Where-Object {
            $ekuOids = @($_.EnhancedKeyUsageList | ForEach-Object { $_.ObjectId.Value })
            $_.HasPrivateKey -and ($ekuOids -contains $codeSigningOid)
          })
          if ($signingCertificates.Count -ne 1) {
            throw "PFX 必须且只能包含一个带私钥的代码签名证书"
          }
          $certificate = $signingCertificates[0]
          if ($certificate.NotBefore -gt [DateTime]::UtcNow -or $certificate.NotAfter -le [DateTime]::UtcNow) {
            throw "代码签名证书当前不在有效期内"
          }
          "thumbprint=$($certificate.Thumbprint)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8

      - name: 构建安装包
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ steps.signing_certificate.outputs.thumbprint }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_THUMBPRINT)) {
            throw "代码签名证书指纹为空"
          }
          $signingConfigPath = Join-Path $env:RUNNER_TEMP "tauri.windows-signing.json"
          @{
            bundle = @{
              windows = @{
                certificateThumbprint = $env:WINDOWS_CERTIFICATE_THUMBPRINT
                digestAlgorithm = "sha256"
                timestampUrl = "http://timestamp.digicert.com"
                tsp = $true
              }
            }
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $signingConfigPath -Encoding utf8
          pnpm --dir gui exec tauri build --ci --config $signingConfigPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 验证 Windows 代码签名
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ steps.signing_certificate.outputs.thumbprint }}
        run: |
          $application = Get-Item -LiteralPath "gui/src-tauri/target/release/ctfbox.exe"
          $setups = @(Get-ChildItem -LiteralPath "gui/src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" -File)
          if ($setups.Count -ne 1) { throw "安装包数量异常：$($setups.Count)" }

          $expectedThumbprint = $env:WINDOWS_CERTIFICATE_THUMBPRINT.Replace(" ", "").ToUpperInvariant()
          foreach ($file in @($application) + $setups) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne "Valid") {
              throw "Windows 代码签名无效：$($file.Name)，状态：$($signature.Status)"
            }
            $actualThumbprint = $signature.SignerCertificate.Thumbprint.Replace(" ", "").ToUpperInvariant()
            if ($actualThumbprint -ne $expectedThumbprint) {
              throw "Windows 代码签名证书与构建证书不一致：$($file.Name)"
            }
            if ($null -eq $signature.TimeStamperCertificate) {
              throw "Windows 代码签名缺少可信时间戳：$($file.Name)"
            }
          }

      - name: 发布到 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $env:RELEASE_VERSION
          if ($tag -ne "v$version" -or $version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "发布版本输出无效"
          }

          $builtAssets = @(Get-ChildItem -LiteralPath "gui/src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" -File)
          if ($builtAssets.Count -ne 1) { throw "安装包数量异常：$($builtAssets.Count)" }
          $assetName = "CTFBox-$version-windows-x64-setup.exe"
          $assetDirectory = Join-Path $env:RUNNER_TEMP "ctfbox-release-assets"
          New-Item -ItemType Directory -Path $assetDirectory -Force | Out-Null
          $assetPath = Join-Path $assetDirectory $assetName
          Copy-Item -LiteralPath $builtAssets[0].FullName -Destination $assetPath -Force
          $asset = Get-Item -LiteralPath $assetPath
          $localHash = (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedDigest = "sha256:$localHash"

          $releaseJson = Join-Path $env:RUNNER_TEMP "ctfbox-release.json"
          $releaseError = Join-Path $env:RUNNER_TEMP "ctfbox-release-error.txt"
          gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" > $releaseJson 2> $releaseError
          $queryExitCode = $LASTEXITCODE
          if ($queryExitCode -eq 0) {
            $release = Get-Content -LiteralPath $releaseJson -Raw | ConvertFrom-Json
            if (-not $release.draft) {
              throw "该标签的 Release 已发布，停止覆盖：$tag"
            }
            if ($release.prerelease) {
              throw "草稿 Release 被标记为预发布版本，停止发布：$tag"
            }
            foreach ($existingAsset in @($release.assets)) {
              gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/releases/assets/$($existingAsset.id)"
              if ($LASTEXITCODE -ne 0) { throw "清理草稿 Release 旧资产失败" }
            }
            gh release upload $tag $asset.FullName --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "上传 Setup 到草稿 Release 失败" }
          } else {
            $queryError = Get-Content -LiteralPath $releaseError -Raw
            if ($queryError -notmatch 'HTTP 404') {
              throw "查询 GitHub Release 失败，退出码：$queryExitCode"
            }
            gh release create $tag $asset.FullName --repo $env:GITHUB_REPOSITORY --draft --title "CTFBox $tag" --generate-notes --verify-tag
            if ($LASTEXITCODE -ne 0) { throw "创建草稿 Release 失败" }
          }
          $release = $null
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw "读取已发布 Release 失败" }
            if ($release.assets.Count -eq 1 -and $release.assets[0].digest -eq $expectedDigest) {
              break
            }
            Start-Sleep -Seconds 5
          }
          if (-not $release.draft -or $release.prerelease) { throw "Release 草稿状态异常" }
          if ($release.assets.Count -ne 1) { throw "Release 必须且只能包含一个 Setup" }
          if ($release.assets[0].name -ne $assetName) { throw "Release Setup 名称不符合规范" }
          if ($release.assets[0].digest -ne $expectedDigest) { throw "GitHub 资产 digest 与本地 Setup 不一致" }

          $downloadDirectory = Join-Path $env:RUNNER_TEMP "ctfbox-release-download"
          New-Item -ItemType Directory -Path $downloadDirectory -Force | Out-Null
          gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern $assetName --dir $downloadDirectory
          if ($LASTEXITCODE -ne 0) { throw "重新下载已发布 Setup 失败" }
          $downloadedAsset = Get-Item -LiteralPath (Join-Path $downloadDirectory $assetName)
          $downloadedHash = (Get-FileHash -LiteralPath $downloadedAsset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($downloadedHash -ne $localHash) { throw "Release 草稿 Setup 下载校验失败" }

          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest --title "CTFBox $tag"
          if ($LASTEXITCODE -ne 0) { throw "发布 Release 失败，草稿已保留以便重试" }
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "读取已发布 Release 失败" }
          if ($release.draft -or $release.prerelease) { throw "Release 未处于稳定发布状态" }
          if ($release.assets.Count -ne 1) { throw "已发布 Release 资产数量异常" }
          if ($release.assets[0].name -ne $assetName -or $release.assets[0].digest -ne $expectedDigest) {
            throw "已发布 Release 资产信息异常"
          }

      - name: 清理 Windows 代码签名证书
        if: always()
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ steps.signing_certificate.outputs.thumbprint }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_THUMBPRINT)) {
            $certificatePath = "Cert:\CurrentUser\My\$($env:WINDOWS_CERTIFICATE_THUMBPRINT)"
            if (Test-Path -LiteralPath $certificatePath) {
              Remove-Item -LiteralPath $certificatePath -Force
            }
          }
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP "ctfbox-codesign.pfx") -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP "tauri.windows-signing.json") -Force -ErrorAction SilentlyContinue
