name: 发布 Windows 安装包

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    name: 构建并发布 Windows 安装包
    runs-on: windows-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 配置 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.6.0 --activate

      - name: 安装前端依赖
        shell: pwsh
        run: pnpm --dir gui install --frozen-lockfile

      - name: 构建安装包
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: pnpm --dir gui build

      - name: 发布到 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = Get-Item "gui/src-tauri/target/release/bundle/nsis/*-setup.exe"
          $updater = Get-Item "gui/src-tauri/target/release/bundle/nsis/*.nsis.zip"
          if (@($asset).Count -ne 1) { throw "安装包数量异常：$(@($asset).Count)" }
          if (@($updater).Count -ne 1) { throw "更新归档数量异常：$(@($updater).Count)" }
          $signatureAsset = Get-Item "$($updater.FullName).sig"
          $checksum = (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash
          "$checksum  $($asset.Name)" | Set-Content -LiteralPath "SHA256SUMS.txt" -Encoding ascii
          $tag = $env:GITHUB_REF_NAME
          $version = $tag -replace '^v', ''
          $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $signature = (Get-Content -LiteralPath $signatureAsset.FullName -Raw).Trim()
          $downloadUrl = "https://github.com/ZBHD/CTFBox/releases/download/$tag/$($updater.Name)"
          $manifest = [ordered]@{
            version = $version
            notes = "CTFBox $tag"
            pub_date = $pubDate
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url = $downloadUrl
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath "latest.json" -Encoding utf8
          gh release create $tag $asset.FullName "SHA256SUMS.txt" $updater.FullName $signatureAsset.FullName "latest.json" --title "CTFBox $tag" --generate-notes --latest
