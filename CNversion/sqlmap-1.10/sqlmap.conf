regRead = False

# 写入Windows注册表键值数据。
# 有效：正确或错误
regAdd = False

# Delete a Windows registry key value.
# 有效：正确或错误
regDel = False

# Windows 注册表项。
regKey = 

# Windows 注册表项值。
regVal = 

# Windows 注册表键值数据。
regData = 

# Windows 注册表键值类型。
regType = 


# 这些选项可用于设置一些常规工作参数。
[General]

# 从存储的 (.sqlite) 文件加载会话
# 示例：output/www.target.com/session.sqlite
sessionFile = 

# 将所有 HTTP 流量记录到文本文件中。
trafficFile = 

# 中止对空结果的数据检索。
abortOnEmpty = False

# 设置预定义的答案（例如“quit=N，follow=N”）。
answers =

# 包含 Base64 编码数据的参数
base64Parameter =

# 使用 URL 和文件名安全 Base64 字母表（参考：https://en.wikipedia.org/wiki/Base64#URL_applications).
# 有效：正确或错误
base64Safe = False

# 从不要求用户输入，使用默认行为。
# 有效：正确或错误
batch = False

# 具有二进制值的结果字段（例如“摘要”）。
binaryFields =

# 在评估目标之前检查互联网连接。
checkInternet = False

# 从 sqlmap 特定的 UDF 和表中清理 DBMS。
# 有效：正确或错误
cleanup = False

# 从目标 URL 开始抓取网站。
# 有效：整数
# Default: 0
crawlDepth = 0

# 用于排除页面爬行的正则表达式（例如“注销”）。
crawlExclude =

# CSV 输出中使用的定界字符。
# Default: ,
csvDel = ,

# 将转储的数据存储到自定义文件中。
dumpFile =

# 转储数据的格式
# 有效：CSV、HTML 或 SQLITE
dumpFormat = CSV

# 强制使用字符编码进行数据检索。
encoding = 

# 检索每个查询输出长度并计算估计时间
# 实时到达。
# 有效：正确或错误
eta = False

# 刷新当前目标的会话文件。
# 有效：正确或错误
flushSession = False

# 解析和测试目标 URL 上的表单。
# 有效：正确或错误
forms = False

# 忽略存储在会话文件中的查询结果。
# 有效：正确或错误
freshQueries = False

# 使用指定页码的 Google dork 结果。
# 有效：整数
# Default: 1
googlePage = 1

# 在数据检索期间使用十六进制转换。
# 有效：正确或错误
hexConvert = False

# 自定义输出目录路径。
outputDir =

# 解析并显示响应中的 DBMS 错误消息。
# 有效：正确或错误
parseErrors = False

# 使用给定的脚本来预处理请求。
preprocess =

# 使用给定的脚本对响应数据进行后处理。
postprocess =

# 重新转储具有未知字符标记 (?) 的条目。
# 有效：正确或错误
repair = False

# 用于从提供的 Burp 中过滤目标的正则表达式。
# 或 WebScarab 代理日志。
# 示例：（谷歌|雅虎）
scope = 

# 跳过 SQLi/XSS 漏洞的启发式检测。
# 有效：正确或错误
skipHeuristics = False

# 跳过 WAF/IPS 保护的启发式检测。
# 有效：正确或错误
skipWaf = False

# 用于临时表的前缀。
# 默认值：sqlmap
tablePrefix = sqlmap

# Select tests by payloads and/or titles (e.g. ROW).
testFilter =

# 跳过载荷和/或标题的测试（例如 BENCHMARK）。
testSkip =

# 运行时间限制以秒为单位（例如 3600）。
timeLimit =

# 禁用 DBMS 标识符（例如“用户”）的转义。
unsafeNaming = False

# Web 服务器文档根目录（例如“/var/www”）。
webRoot =


[Miscellaneous]

# 发现 SQL 注入时运行主机操作系统命令。
alert =

# 当出现问题和/或发现 SQL 注入时发出蜂鸣声。
# 有效：正确或错误
beep = False

# 离线WAF/IPS负载检测测试。
# 有效：正确或错误
checkPayload = False

# 检查是否缺少（可选）sqlmap 依赖项。
# 有效：正确或错误
dependencies = False

# 禁用控制台输出着色。
# 有效：正确或错误
disableColoring = False

# 对表转储禁用哈希分析。
# 有效：正确或错误
disableHashing = False

# 显示可用篡改脚本的列表。
# 有效：正确或错误
listTampers = False

# 禁用记录到文件。
# 有效：正确或错误
noLogging = False

# 禁用控制台输出截断。
# 有效：正确或错误
noTruncate = False

# 在离线模式下工作（仅使用会话数据）
# 有效：正确或错误
offline = False

# 多目标模式下 CSV 结果文件的位置。
resultsFile =

# 用于存储临时文件的本地目录。
tmpDir =

# 调整不稳定连接的选项。
# 有效：正确或错误
unstable = False

# Update sqlmap.
# 有效：正确或错误
updateAll = False

# 适合初学者的简单向导界面。
# 有效：正确或错误
wizard = False

# 详细程度。
# 有效：0 到 6 之间的整数
# 0：仅显示错误和严重消息
# 1：还显示警告和信息消息
# 2：还显示调试消息
# 3：还显示注入的载荷
# 4：还显示 HTTP 请求
# 5：还显示 HTTP 响应的请求头
# 6：还显示HTTP响应的页面内容
# Default: 1
verbose = 1
