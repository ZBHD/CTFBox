name: 发布 Windows 安装包

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    name: 构建并发布 Windows 安装包
    runs-on: windows-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 配置 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.6.0 --activate

      - name: 安装前端依赖
        shell: pwsh
        run: pnpm --dir gui install --frozen-lockfile

      - name: 验证发布版本
        id: release_version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(?<version>(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*))$') {
            throw "发布标签必须是稳定版 SemVer（例如 v1.2.3）：$tag"
          }
          $version = $Matches.version
          $tauriVersion = (Get-Content -LiteralPath "gui/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          $packageVersion = (Get-Content -LiteralPath "gui/package.json" -Raw | ConvertFrom-Json).version
          $cargoMetadata = cargo metadata --locked --no-deps --format-version 1 --manifest-path "gui/src-tauri/Cargo.toml" | ConvertFrom-Json
          $cargoPackages = @($cargoMetadata.packages | Where-Object { $_.name -eq "ctfbox" })
          if ($cargoPackages.Count -ne 1) {
            throw "无法唯一确定 ctfbox Rust 包版本"
          }
          $cargoVersion = $cargoPackages[0].version
          if ($tauriVersion -ne $version -or $cargoVersion -ne $version -or $packageVersion -ne $version) {
            throw "版本不一致：tag=$version, tauri=$tauriVersion, cargo=$cargoVersion, package=$packageVersion"
          }
          "version=$version" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8

      - name: 前端质量检查
        shell: pwsh
        run: |
          pnpm --dir gui typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir gui test:unit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 构建安装包
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --dir gui build

      - name: 验证更新签名
        shell: pwsh
        run: |
          $updaters = @(Get-ChildItem -LiteralPath "gui/src-tauri/target/release/bundle/nsis" -Filter "*.nsis.zip" -File)
          if ($updaters.Count -ne 1) { throw "更新归档数量异常：$($updaters.Count)" }
          $updater = $updaters[0]
          $signatureFile = "$($updater.FullName).sig"
          $signatureAsset = Get-Item -LiteralPath $signatureFile -ErrorAction Stop
          $config = Get-Content -LiteralPath "gui/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $publicKeyFile = Join-Path $env:RUNNER_TEMP "ctfbox-updater.pub"
          $decodedSignatureFile = Join-Path $env:RUNNER_TEMP "ctfbox-updater.sig"
          try {
            $publicKeyBytes = [Convert]::FromBase64String($config.plugins.updater.pubkey)
            $signatureBytes = [Convert]::FromBase64String((Get-Content -LiteralPath $signatureFile -Raw).Trim())
          } catch {
            throw "更新签名材料不是有效的 Base64：$($_.Exception.Message)"
          }
          [IO.File]::WriteAllBytes($publicKeyFile, $publicKeyBytes)
          [IO.File]::WriteAllBytes($decodedSignatureFile, $signatureBytes)
          $env:CTFBOX_UPDATER_ARCHIVE = $updater.FullName
          $env:CTFBOX_UPDATER_SIGNATURE = $decodedSignatureFile
          $env:CTFBOX_UPDATER_PUBLIC_KEY = $publicKeyFile
          cargo test --locked --manifest-path "gui/src-tauri/Cargo.toml" --test updater_signature -- --ignored --exact signed_updater_archive_matches_embedded_public_key | Tee-Object -Variable verificationOutput
          if ($LASTEXITCODE -ne 0) { throw "更新签名验证失败" }
          if (($verificationOutput -join "`n") -notmatch 'test result: ok\. 1 passed; 0 failed; 0 ignored;') {
            throw "更新签名验证未执行唯一的门禁测试"
          }

      - name: 发布到 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          $sourceAsset = Get-Item "gui/src-tauri/target/release/bundle/nsis/*-setup.exe"
          $updater = Get-Item "gui/src-tauri/target/release/bundle/nsis/*.nsis.zip"
          if (@($sourceAsset).Count -ne 1) { throw "安装包数量异常：$(@($sourceAsset).Count)" }
          if (@($updater).Count -ne 1) { throw "更新归档数量异常：$(@($updater).Count)" }
          $tag = $env:GITHUB_REF_NAME
          $version = $env:RELEASE_VERSION
          if ($tag -ne "v$version" -or $version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "发布版本输出无效"
          }
          $assetName = "CTFBox-$version-windows-x64-setup.exe"
          $assetPath = Join-Path $env:RUNNER_TEMP $assetName
          Copy-Item -LiteralPath $sourceAsset.FullName -Destination $assetPath
          $asset = Get-Item -LiteralPath $assetPath
          $signatureFile = "$($updater.FullName).sig"
          $signatureAsset = Get-Item -LiteralPath $signatureFile
          $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $signature = (Get-Content -LiteralPath $signatureFile -Raw).Trim()
          $repositoryUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY"
          $downloadUrl = "$repositoryUrl/releases/download/$tag/$($updater.Name)"
          $manifest = [ordered]@{
            version = $version
            notes = "CTFBox $tag"
            pub_date = $pubDate
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url = $downloadUrl
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath "latest.json" -Encoding utf8
          $releaseJson = Join-Path $env:RUNNER_TEMP "ctfbox-release.json"
          $releaseError = Join-Path $env:RUNNER_TEMP "ctfbox-release-error.txt"
          gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" > $releaseJson 2> $releaseError
          $queryExitCode = $LASTEXITCODE
          if ($queryExitCode -eq 0) {
            $release = Get-Content -LiteralPath $releaseJson -Raw | ConvertFrom-Json
            if (-not $release.draft) {
              throw "该标签的 Release 已发布，停止覆盖：$tag"
            }
            if ($release.prerelease) {
              throw "草稿 Release 被标记为预发布版本，停止发布：$tag"
            }
            gh release upload $tag $asset.FullName $updater.FullName $signatureAsset.FullName "latest.json" --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw "覆盖草稿 Release 资产失败" }
          } else {
            $queryError = Get-Content -LiteralPath $releaseError -Raw
            if ($queryError -notmatch 'HTTP 404') {
              throw "查询 GitHub Release 失败，退出码：$queryExitCode"
            }
          gh release create $tag $asset.FullName $updater.FullName $signatureAsset.FullName "latest.json" --repo $env:GITHUB_REPOSITORY --draft --title "CTFBox $tag" --generate-notes --verify-tag
            if ($LASTEXITCODE -ne 0) { throw "创建草稿 Release 失败" }
          }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest --title "CTFBox $tag"
          if ($LASTEXITCODE -ne 0) { throw "发布 Release 失败，草稿已保留以便重试" }
